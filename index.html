<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bhajiipala</title>
<meta name="description" content="Fresh vegetables and groceries delivered from local Solapur vendors - order bhaji pala online">
<meta name="theme-color" content="#FFB300">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bhajiipala">
<style>
html,body{margin:0;padding:0;height:100%;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#FFB300}
header{height:env(safe-area-inset-top,0);background:#FFB300}
.splash{position:absolute;inset:0;background:#FFB300;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10;transition:opacity .4s}
.splash img{width:100px;height:100px;border-radius:24px;box-shadow:0 8px20px rgba(0,0,0,.15);margin-bottom:16px;background:#fff;padding:8px}
.splash h1{margin:0;font-size:22px;font-weight:600}
.splash p{margin:4px 0 0;opacity:.9}
iframe{flex:1;border:0;width:100%;height:100%;background:#fff}
.install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));background:#fff;padding:12px 16px;border-radius:16px;box-shadow:0 8px24px rgba(0,0,0,.15);display:none;align-items:center;justify-content:space-between;z-index:20}
.install button{background:#FFB300;color:#000;border:0;padding:10px 16px;border-radius:12px;font-weight:600}
.hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="app">
<header></header>
<div class="splash" id="splash">
<img src="icon-192.png" alt="Bhajiipala">
<h1>Bhajiipala</h1>
<p>Fresh Vegetables</p>
</div>
<iframe id="frame" src="https://bhajiipala.lovable.app/" allow="geolocation; camera; microphone; payment"></iframe>
</div>
<div class="install" id="installBox">
<span>Install Bhajiipala app?</span>
<button id="installBtn">Install</button>
</div>
<script>
const splash=document.getElementById('splash');
const frame=document.getElementById('frame');
frame.addEventListener('load',()=>{setTimeout(()=>splash.classList.add('hidden'),800)});

// PWA install
let deferredPrompt;
const installBox=document.getElementById('installBox');
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBox.style.display='flex'});
installBtn.addEventListener('click',async()=>{installBox.style.display='none';if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}});

// Service worker
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js')})}
</script>
</body>
</html>
